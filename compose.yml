services:
  postgres:
    image: postgres:18-alpine
    container_name: personal-site-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_site
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./ResourceApi/Database/Migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data: