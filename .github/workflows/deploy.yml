name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    environment: production
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment secrets
        run: |
          for name in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_KEY CLOUDFLARE_TUNNEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not configured"
              exit 1
            fi
          done

      - name: Build production images
        run: docker compose -f compose.yml -f compose.prod.yml build

      - name: Deploy production stack
        run: docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
