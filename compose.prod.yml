services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
  db:
    restart: unless-stopped
  cloudflared:
    container_name: et-cf
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped